<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrapeJS Rendering Test</title>
    <script src="https://unpkg.com/grapesjs@0.22.14/dist/grapes.min.js"></script>
    <style>
        body { margin: 20px; font-family: Arial, sans-serif; }
        #editor { height: 400px; border: 1px solid #ddd; }
        #output { margin-top: 20px; padding: 10px; background: #f5f5f5; white-space: pre-wrap; }
        button { margin: 5px; padding: 10px 15px; }
    </style>
</head>
<body>
    <h1>🧪 GrapeJS Rendering Test</h1>

    <div>
        <button onclick="testBasicRendering()">Test Basic Rendering</button>
        <button onclick="testWithProjectData()">Test with Project Data</button>
        <button onclick="clearOutput()">Clear Output</button>
    </div>

    <div id="editor"></div>

    <h2>Output:</h2>
    <div id="output">Click a test button to see results...</div>

    <script>
        let editor = null;

        // Sample GrapeJS project data
        const sampleProjectData = {
            pages: [
                {
                    id: "main-page",
                    type: "main",
                    frames: [
                        {
                            component: {
                                type: "wrapper",
                                stylable: ["background", "background-color", "background-image"],
                                attributes: { class: "store-page" },
                                components: [
                                    {
                                        type: "section",
                                        attributes: { class: "store-header" },
                                        stylable: ["background", "padding", "margin", "text-align"],
                                        components: [
                                            {
                                                type: "text",
                                                attributes: { class: "store-title" },
                                                content: "Test Store Title",
                                                stylable: ["font-family", "font-size", "color", "text-align"]
                                            }
                                        ]
                                    }
                                ]
                            }
                        }
                    ]
                }
            ],
            styles: [
                {
                    selectors: [".store-title"],
                    style: {
                        "font-size": "24px",
                        "color": "#333",
                        "text-align": "center"
                    }
                }
            ]
        };

        function initializeEditor() {
            if (editor) {
                editor.destroy();
            }

            editor = grapesjs.init({
                container: '#editor',
                headless: true,
                components: '',
                style: '',
                storageManager: false,
                assetManager: { assets: [] },
                blockManager: false,
                layerManager: false,
                traitManager: false,
                selectorManager: false,
                styleManager: false,
                deviceManager: false,
                panels: false,
                modal: false,
                commands: false,
                keymaps: false,
            });

            return editor;
        }

        function testBasicRendering() {
            try {
                const output = document.getElementById('output');
                output.textContent = 'Initializing editor...\n';

                const testEditor = initializeEditor();
                output.textContent += 'Editor initialized\n';

                // Load project data
                testEditor.loadProjectData(sampleProjectData);
                output.textContent += 'Project data loaded\n';

                // Extract HTML and CSS
                const html = testEditor.getHtml();
                const css = testEditor.getCss();

                output.textContent += '\n=== HTML Output ===\n' + html + '\n\n';
                output.textContent += '=== CSS Output ===\n' + css + '\n';

                // Cleanup
                testEditor.destroy();
                output.textContent += '\n✅ Basic rendering test completed successfully!\n';

            } catch (error) {
                document.getElementById('output').textContent = '❌ Error: ' + error.message + '\n' + error.stack;
            }
        }

        function testWithProjectData() {
            try {
                const output = document.getElementById('output');
                output.textContent = 'Testing with project data...\n';

                const testEditor = initializeEditor();

                // Test different data structures
                const testData = {
                    pages: [{
                        frames: [{
                            component: {
                                type: "div",
                                components: [{
                                    type: "text",
                                    content: "Hello World!"
                                }]
                            }
                        }]
                    }],
                    styles: []
                };

                testEditor.loadProjectData(testData);
                const html = testEditor.getHtml();
                const css = testEditor.getCss();

                output.textContent += '\n=== Rendered HTML ===\n' + html + '\n';
                output.textContent += '=== Rendered CSS ===\n' + css + '\n';

                testEditor.destroy();
                output.textContent += '\n✅ Project data test completed!\n';

            } catch (error) {
                document.getElementById('output').textContent = '❌ Error: ' + error.message;
            }
        }

        function clearOutput() {
            document.getElementById('output').textContent = 'Output cleared. Click a test button...';
        }

        // Auto-test on load
        window.addEventListener('load', function() {
            document.getElementById('output').textContent += '\n🔄 Page loaded. GrapeJS version: ' + (grapesjs ? grapesjs.version : 'unknown');
        });
    </script>
</body>
</html>
