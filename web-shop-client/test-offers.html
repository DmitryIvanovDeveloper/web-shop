<!DOCTYPE html>
<html>
<head>
    <title>Test Offers System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .offer-card { border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .loading { color: #666; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Test Offers System</h1>
    
    <h2>API Endpoints Test:</h2>
    <div id="api-tests"></div>
    
    <h2>Offers from Rules:</h2>
    <div id="offers-container">
        <div class="loading">Loading offers...</div>
    </div>

    <script>
        async function testAPI() {
            const container = document.getElementById('api-tests');
            
            // Test rules API
            try {
                const rulesResponse = await fetch('/api/offers/rules');
                const rules = await rulesResponse.json();
                container.innerHTML += `<p>✅ Rules API: ${JSON.stringify(rules)}</p>`;
            } catch (error) {
                container.innerHTML += `<p>❌ Rules API Error: ${error.message}</p>`;
            }
            
            // Test user purchases API
            try {
                const purchasesResponse = await fetch('/api/user/purchases');
                const purchases = await purchasesResponse.json();
                container.innerHTML += `<p>✅ User Purchases API: ${JSON.stringify(purchases)}</p>`;
            } catch (error) {
                container.innerHTML += `<p>❌ User Purchases API Error: ${error.message}</p>`;
            }
            
            // Test offer API
            try {
                const offerResponse = await fetch('/api/products/offers/tank-turret');
                const offer = await offerResponse.json();
                container.innerHTML += `<p>✅ Offer API: ${JSON.stringify(offer)}</p>`;
            } catch (error) {
                container.innerHTML += `<p>❌ Offer API Error: ${error.message}</p>`;
            }
        }
        
        async function loadOffers() {
            const container = document.getElementById('offers-container');
            
            try {
                // Load rules
                const rulesResponse = await fetch('/api/offers/rules');
                const rules = await rulesResponse.json();
                
                // Load user purchases
                const purchasesResponse = await fetch('/api/user/purchases');
                const purchases = await purchasesResponse.json();
                
                // Evaluate condition: user.purchases.length >= 1
                const userPurchasesLength = purchases.length;
                const conditionValue = 1;
                
                if (userPurchasesLength >= conditionValue) {
                    // Condition is true, show offer
                    const offerResponse = await fetch('/api/products/offers/tank-turret');
                    const offer = await offerResponse.json();
                    
                    container.innerHTML = `
                        <div class="offer-card">
                            <h3>${offer.title}</h3>
                            <p><strong>Rarity:</strong> ${offer.rarity}</p>
                            <p><strong>Price:</strong> ${offer.currentPrice}</p>
                            <p><strong>Discount:</strong> ${offer.discount}</p>
                            <p><strong>Included Items:</strong> ${offer.includedItems.join(', ')}</p>
                            <button style="background: #3B5AFE; color: white; padding: 10px 20px; border: none; border-radius: 5px;">
                                ${offer.buyButton.text}
                            </button>
                        </div>
                    `;
                } else {
                    container.innerHTML = '<p>No offers available (condition not met)</p>';
                }
                
            } catch (error) {
                container.innerHTML = `<div class="error">Error loading offers: ${error.message}</div>`;
            }
        }
        
        // Run tests
        testAPI();
        loadOffers();
    </script>
</body>
</html>
