name: Vercel Deploy

on:
  push:
    branches-ignore: [ main ]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webshops-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webshops-demo/package-lock.json
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Install deps
        run: npm ci
      - name: Inject .env for Vite (preview)
        run: |
          {
            echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}";
            echo "VITE_GDRIVE_ID=${{ secrets.VITE_GDRIVE_ID }}";
            echo "VITE_GDRIVE_ANALYTICS_FOLDER_ID=${{ secrets.VITE_GDRIVE_ANALYTICS_FOLDER_ID }}";
            echo "VITE_GDRIVE_MERCHANT_FOLDER_ID=${{ secrets.VITE_GDRIVE_MERCHANT_FOLDER_ID }}";
            echo "VITE_GDRIVE_REWARDS_FOLDER_ID=${{ secrets.VITE_GDRIVE_REWARDS_FOLDER_ID }}";
            echo "VITE_GDRIVE_CONTENT_FOLDER_ID=${{ secrets.VITE_GDRIVE_CONTENT_FOLDER_ID }}";
            echo "VITE_GDRIVE_LOCALIZATION_FOLDER_ID=${{ secrets.VITE_GDRIVE_LOCALIZATION_FOLDER_ID }}";
            echo "VITE_GDRIVE_PERSONALIZATION_FOLDER_ID=${{ secrets.VITE_GDRIVE_PERSONALIZATION_FOLDER_ID }}";
            echo "VITE_GDRIVE_LIVEOPS_FOLDER_ID=${{ secrets.VITE_GDRIVE_LIVEOPS_FOLDER_ID }}";
            echo "VITE_GDRIVE_SDK_FOLDER_ID=${{ secrets.VITE_GDRIVE_SDK_FOLDER_ID }}";
            echo "VITE_GDRIVE_UIBUILDER_FOLDER_ID=${{ secrets.VITE_GDRIVE_UIBUILDER_FOLDER_ID }}";
            echo "VITE_GDRIVE_WEBSHOP_FOLDER_ID=${{ secrets.VITE_GDRIVE_WEBSHOP_FOLDER_ID }}";
          } > .env
      - name: Pull Vercel env (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy (preview)
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  production:
    if: github.ref == 'refs/heads/web-scenarios'
    runs-on: ubuntu-latest
    defaults: 
      run:
        working-directory: webshops-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webshops-demo/package-lock.json
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Install deps
        run: npm ci
      - name: Inject .env for Vite (production)
        run: |
          {
            echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}";
            echo "VITE_GDRIVE_ID=${{ secrets.VITE_GDRIVE_ID }}";
            echo "VITE_GDRIVE_ANALYTICS_FOLDER_ID=${{ secrets.VITE_GDRIVE_ANALYTICS_FOLDER_ID }}";
            echo "VITE_GDRIVE_MERCHANT_FOLDER_ID=${{ secrets.VITE_GDRIVE_MERCHANT_FOLDER_ID }}";
            echo "VITE_GDRIVE_REWARDS_FOLDER_ID=${{ secrets.VITE_GDRIVE_REWARDS_FOLDER_ID }}";
            echo "VITE_GDRIVE_CONTENT_FOLDER_ID=${{ secrets.VITE_GDRIVE_CONTENT_FOLDER_ID }}";
            echo "VITE_GDRIVE_LOCALIZATION_FOLDER_ID=${{ secrets.VITE_GDRIVE_LOCALIZATION_FOLDER_ID }}";
            echo "VITE_GDRIVE_PERSONALIZATION_FOLDER_ID=${{ secrets.VITE_GDRIVE_PERSONALIZATION_FOLDER_ID }}";
            echo "VITE_GDRIVE_LIVEOPS_FOLDER_ID=${{ secrets.VITE_GDRIVE_LIVEOPS_FOLDER_ID }}";
            echo "VITE_GDRIVE_SDK_FOLDER_ID=${{ secrets.VITE_GDRIVE_SDK_FOLDER_ID }}";
            echo "VITE_GDRIVE_UIBUILDER_FOLDER_ID=${{ secrets.VITE_GDRIVE_UIBUILDER_FOLDER_ID }}";
            echo "VITE_GDRIVE_WEBSHOP_FOLDER_ID=${{ secrets.VITE_GDRIVE_WEBSHOP_FOLDER_ID }}";
          } > .env
      - name: Pull Vercel env (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (prod)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy (prod)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
